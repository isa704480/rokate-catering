# Production: VPS'da ishga tushirish
#   cp .env.example .env   (qiymatlarni to'ldiring)
#   docker compose up -d --build
#   docker compose exec backend python manage.py createsuperuser
name: rokate

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: rokate
      POSTGRES_USER: rokate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rokate -d rokate"]
      interval: 10s
      retries: 5

  backend:
    build: ../backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgres://rokate:${POSTGRES_PASSWORD}@db:5432/rokate
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: ${DOMAIN},www.${DOMAIN},backend,localhost
      DJANGO_CSRF_TRUSTED_ORIGINS: https://${DOMAIN},https://www.${DOMAIN}
      SITE_URL: https://${DOMAIN}
      REVALIDATE_URL: http://frontend:3000/api/revalidate
      MEDIA_ROOT: /app/media
    volumes:
      - media:/app/media

  frontend:
    build:
      context: ../frontend
      args:
        NEXT_PUBLIC_SITE_URL: https://${DOMAIN}
        NEXT_PUBLIC_GA_ID: ${NEXT_PUBLIC_GA_ID:-}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
    restart: unless-stopped
    depends_on: [backend]
    environment:
      API_INTERNAL_URL: http://backend:8000
      REVALIDATE_SECRET: ${REVALIDATE_SECRET}

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [frontend, backend]
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN}
      ADMIN_PATH: ${ADMIN_URL:-manage-rk/}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - media:/srv/media:ro
      - caddy_data:/data
      - caddy_config:/config

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on: [db]
    env_file: .env
    environment:
      PGHOST: db
      PGUSER: rokate
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: rokate
    volumes:
      - ./backup:/backup:ro
      - media:/media:ro
      - backups:/backups
    entrypoint: ["sh", "/backup/entrypoint.sh"]

volumes:
  pgdata:
  media:
  backups:
  caddy_data:
  caddy_config:
